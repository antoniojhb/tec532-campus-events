name: TEC 532 CI/CD

"on":
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: 1 - Test Container
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Get repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t campus-events:test .

      - name: Run application
        run: |
          docker run \
            -d \
            --name campus-events-test \
            -p 8080:80 \
            campus-events:test

      - name: Run smoke test
        run: |
          chmod +x tests/smoke-test.sh
          ./tests/smoke-test.sh http://localhost:8080

      - name: Stop test container
        if: always()
        run: docker rm -f campus-events-test || true

  publish:
    name: 2 - Publish Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.variables.outputs.image }}
      tag: ${{ steps.variables.outputs.tag }}

    steps:
      - name: Get repository
        uses: actions/checkout@v6

      - name: Define image information
        id: variables
        shell: bash
        run: |
          REPOSITORY=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPOSITORY}"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="sha-${SHORT_SHA}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE}"
          echo "Tag: ${TAG}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t "${{ steps.variables.outputs.image }}:${{ steps.variables.outputs.tag }}" \
            -t "${{ steps.variables.outputs.image }}:latest" \
            .

      - name: Publish image
        run: |
          docker push "${{ steps.variables.outputs.image }}:${{ steps.variables.outputs.tag }}"
          docker push "${{ steps.variables.outputs.image }}:latest"

  deploy:
    name: 3 - Deploy and Verify
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Get repository
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        run: docker pull "${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}"

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Create temporary Kubernetes cluster
        run: kind create cluster --name tec532-ci --wait 90s

      - name: Load image into Kubernetes
        run: |
          kind load docker-image \
            "${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}" \
            --name tec532-ci

      - name: Prepare Deployment
        shell: bash
        run: |
          IMAGE="${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}"
          sed \
            -e "s|image: .*|image: ${IMAGE}|" \
            -e "s|imagePullPolicy: .*|imagePullPolicy: IfNotPresent|" \
            k8s/deployment.yaml \
            > /tmp/deployment.yaml
          echo "Deployment used by CI:"
          cat /tmp/deployment.yaml

      - name: Deploy application
        run: |
          kubectl apply -f /tmp/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Wait for Deployment
        run: kubectl rollout status deployment/campus-events --timeout=90s

      - name: Inspect Kubernetes resources
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services

      - name: Connect to application
        run: |
          kubectl port-forward service/campus-events 8081:80 > /tmp/port-forward.log 2>&1 &
          echo $! > /tmp/port-forward.pid
          sleep 5

      - name: Verify Kubernetes deployment
        run: |
          chmod +x tests/smoke-test.sh
          ./tests/smoke-test.sh http://localhost:8081

      - name: Show final state
        if: always()
        run: |
          echo "----- PODS -----"
          kubectl get pods -o wide || true
          echo "----- DEPLOYMENT -----"
          kubectl get deployment campus-events || true
          echo "----- SERVICE -----"
          kubectl get service campus-events || true
          echo "----- PORT FORWARD LOG -----"
          cat /tmp/port-forward.log 2>/dev/null || true

      - name: Delete temporary cluster
        if: always()
        run: kind delete cluster --name tec532-ci || true
